{% extends 'disturbance/base.html' %}
{% load static %}

{% block content %}
    <div class="container border rounded p-4">
        <!-- Success Message Section -->
        <div class="row">
            <div class="col-12">
                <h2>Temporary Use Submitted</h2>
                <p class="my-3">
                    Your Temporary Use form has been successfully submitted.<br>
                    <strong>Date / Time:</strong> {{ modified_date|date:"d/m/Y H:i" }}
                </p>
            </div>
        </div>

        <!-- Action Footer -->
        <div class="row mt-4 pt-3 border-top">
            <div class="col-12 d-flex justify-content-end">
                <a href="{% url 'external' %}" class="btn btn-primary">Return to Dashboard</a>
            </div>
        </div>
    </div>
{% endblock %}
